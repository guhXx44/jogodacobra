<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Shooter</title>
    <!-- Vincula o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="hud">
            <div class="stat">PONTOS: <span id="score">0</span></div>
            <div class="stat" id="upgrade">ARMA: NÍVEL 1</div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="stat">ESCUDO:</div>
                <div class="hp-bar-container"><div id="hp-bar"></div></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="500" height="600"></canvas>

        <div class="controls-hint">Use as **Setas** (◄ ►) ou **A / D** para mover. O tiro é **Automático**!</div>
    </div>

    <!-- Vincula a lógica do jogo em JavaScript -->
    <script src="script.js"></script>
</body>
</html>
