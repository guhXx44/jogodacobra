<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Doom Raycaster 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Tela de Renderização 3D -->
        <div class="screen-wrapper">
            <canvas id="gameCanvas" width="640" height="400"></canvas>
            
            <!-- Interface da Arma Clássica (Doom Style) -->
            <div id="weapon"></div>
            
            <!-- Mira Central -->
            <div class="crosshair">+</div>
        </div>

        <div class="controls-hint">
            <strong>Controles:</strong> Use <strong>W, A, S, D</strong> ou as <strong>Setas</strong> para andar/girar. 
            Clique com o <strong>Mouse na tela</strong> para Atirar!
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
