<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        #score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        #score {
            font-weight: bold;
            color: #ffeb3b;
        }

        canvas {
            background-color: #111;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Jogo da Cobrinha</h1>
    <div id="score-board">Pontuação: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">Use as setas do teclado (▲ ▼ ◄ ►) para jogar.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Tamanho de cada quadrado do tabuleiro e velocidade
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let speed = 7; // Quanto menor, mais lento. 7 é um bom começo.

        // Posição inicial da cobra
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        // Posição inicial da comida
        let food = { x: 5, y: 5 };

        // Movimento inicial (parado ou andando para a direita)
        let dx = 1;
        let dy = 0;

        // Controle para evitar que a cobra mude de direção rápido demais e se atropele
        let changingDirection = false;

        let score = 0;

        // Loop principal do jogo
        function main() {
            if (hasGameEnded()) {
                alert(`Fim de Jogo! Sua pontuação final foi: ${score}`);
                resetGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();

            // Repete o loop baseado na velocidade definida
            setTimeout(main, 1000 / speed);
        }

        // Inicia o jogo pela primeira vez
        document.addEventListener("keydown", changeDirection);
        main();

        // Limpa a tela a cada frame
        function clearCanvas() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Desenha a cobra na tela
        function drawSnake() {
            snake.forEach((part, index) => {
                // A cabeça é verde escura, o corpo é verde claro
                ctx.fillStyle = index === 0 ? "#2E7D32" : "#4CAF50";
                ctx.strokeStyle = "#111"; // Borda sutil entre os pedaços da cobra
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        // Movimenta a cobra mudando as coordenadas
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Verifica se a cobra comeu a comida
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
                // Aumenta ligeiramente a velocidade a cada 50 pontos
                if (score % 50 === 0) speed += 0.5;
            } else {
                // Se não comeu, remove o último pedaço para manter o tamanho correto
                snake.pop();
            }
        }

        // Desenha a comida (quadradinho vermelho)
        function drawFood() {
            ctx.fillStyle = "#f44336";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // Gera uma nova comida em posição aleatória
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Garante que a comida não apareça em cima da cobra
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        // Mapeia as setas do teclado para mudar a direção do movimento
        function changeDirection(event) {
            const LEFT_KEY = 37;
            const UP_KEY = 38;
            const RIGHT_KEY = 39;
            const DOWN_KEY = 40;

            if (changingDirection) return;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        }

        // Verifica colisões com as paredes ou com o próprio corpo
        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // Reseta as variáveis para recomeçar o jogo
        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            food = { x: 5, y: 5 };
            dx = 1;
            dy = 0;
            score = 0;
            speed = 7;
            scoreElement.innerText = score;
            main();
        }
    </script>
</body>
</html>
