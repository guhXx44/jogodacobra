<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Deluxe Edition</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .game-container {
            position: relative;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .score-val {
            color: #00e5ff;
            font-weight: bold;
        }

        #highScore {
            color: #ffeb3b;
        }

        canvas {
            background-color: #050505;
            border: 3px solid #333;
            border-radius: 8px;
            display: block;
        }

        /* Telas Sobrepostas (Menu, Pause, Game Over) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        button {
            background: linear-gradient(135deg, #00ff88, #00b359);
            color: #121212;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.6);
        }

        .btn-pause {
            background: #333;
            color: #fff;
            box-shadow: none;
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        .btn-pause:hover { background: #444; box-shadow: none; }

        select {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #00ff88;
            padding: 8px 15px;
            font-size: 1rem;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            outline: none;
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #aaa;
        }

        /* Controles Virtuais para Celular */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
            margin-top: 15px;
            justify-content: center;
        }

        .d-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .d-btn:active { background: #00ff88; color: #000; }

        /* Esconde o D-pad em telas grandes */
        @media (min-width: 768px) {
            .d-pad { display: none; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Snake Deluxe</h1>
        
        <div class="scoreboard">
            <div>Pontos: <span id="score" class="score-val">0</span></div>
            <div>Recorde: <span id="highScore" class="score-val">0</span></div>
        </div>

        <div style="position: relative;">
            <!-- Tela de Menu Inicial -->
            <div id="menuScreen" class="overlay">
                <h2 style="color: #00ff88; margin-bottom: 5px;">Menu Principal</h2>
                <p style="color: #aaa; margin-bottom: 5px;">Escolha a velocidade:</p>
                <select id="difficultySelect">
                    <option value="5">🥛 Fácil (Tranquilo)</option>
                    <option value="9" selected>🌶️ Médio (Padrão)</option>
                    <option value="14">🔥 Difícil (Insano)</option>
                </select>
                <button onclick="startGame()">Jogar</button>
            </div>

            <!-- Tela de Pause -->
            <div id="pauseScreen" class="overlay hidden">
                <h2 style="color: #00e5ff;">Jogo Pausado</h2>
                <p style="color: #aaa;">Pressione ESC ou clique no botão para voltar</p>
                <button onclick="togglePause()">Continuar</button>
            </div>

            <!-- Tela de Game Over -->
            <div id="gameOverScreen" class="overlay hidden">
                <h2 style="color: #ff3333;">Fim de Jogo!</h2>
                <p>Sua pontuação: <span id="finalScore" style="color: #00ff88; font-weight: bold;">0</span></p>
                <button onclick="backToMenu()">Menu Principal</button>
            </div>

            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div style="margin-top: 10px; display: flex; justify-content: center; gap: 10px;">
            <button class="btn-pause" onclick="togglePause()">Pausar (ESC)</button>
        </div>

        <!-- Controles para Celular -->
        <div class="d-pad">
            <div></div><div class="d-btn" onclick="handleDirection('UP')">▲</div><div></div>
            <div class="d-btn" onclick="handleDirection('LEFT')">◄</div><div></div><div class="d-btn" onclick="handleDirection('RIGHT')">►</div>
            <div></div><div class="d-btn" onclick="handleDirection('DOWN')">▼</div><div></div>
        </div>

        <div class="controls-hint">Use as setas do teclado ou as teclas W, A, S, D.</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // Elementos da Interface
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const finalScoreElement = document.getElementById("finalScore");
        const menuScreen = document.getElementById("menuScreen");
        const pauseScreen = document.getElementById("pauseScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const difficultySelect = document.getElementById("difficultySelect");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake, food, dx, dy, score, baseSpeed, isPaused, gameInterval, changingDirection;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        highScoreElement.innerText = highScore;

        function initVariables() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            food = { x: 5, y: 5 };
            dx = 1;
            dy = 0;
            score = 0;
            isPaused = false;
            changingDirection = false;
            scoreElement.innerText = score;
            baseSpeed = parseInt(difficultySelect.value);
        }

        function startGame() {
            menuScreen.classList.add("hidden");
            gameOverScreen.classList.add("hidden");
            pauseScreen.classList.add("hidden");
            initVariables();
            generateFood();
            gameLoop();
        }

        function gameLoop() {
            if (isPaused) return;

            if (hasGameEnded()) {
                handleGameOver();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();

            // Ajusta dinamicamente a velocidade conforme os pontos aumentam
            let currentSpeed = baseSpeed + Math.floor(score / 50);
            gameInterval = setTimeout(gameLoop, 1000 / currentSpeed);
        }

        function clearCanvas() {
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Linhas de grade sutis no fundo
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 0.5;
            for(let i=0; i<tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i*gridSize, 0); ctx.lineTo(i*gridSize, canvas.height);
                ctx.moveTo(0, i*gridSize); ctx.lineTo(canvas.width, i*gridSize);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Efeito degradê na cobra (Cabeça verde brilhante, corpo vai escurecendo)
                ctx.fillStyle = index === 0 ? "#00ff88" : `rgba(0, 179, 89, ${1 - (index / snake.length) * 0.6})`;
                ctx.shadowBlur = index === 0 ? 10 : 0;
                ctx.shadowColor = "#00ff88";
                
                // Desenha os gomos arredondados
                ctx.beginPath();
ctx.arc((part.x * gridSize) + gridSize/2, (part.y * gridSize) + gridSize/2, gridSize/2 - 1, 0, 2 * Math.PI);
ctx.fill();
});
ctx.shadowBlur = 0; // Reseta o efeito neon
}
function moveSnake() {
const head = { x: snake[0].x + dx, y: snake[0].y + dy };
snake.unshift(head);
if (snake[0].x === food.x && snake[0].y === food.y) {
score += 10;
scoreElement.innerText = score;
if (score > highScore) {
highScore = score;
highScoreElement.innerText = highScore;
localStorage.setItem("snakeHighScore", highScore);
}
generateFood();
} else {
snake.pop();
}
}
function drawFood() {
ctx.fillStyle = "#ff3366";
ctx.shadowBlur = 12;
ctx.shadowColor = "#ff3366";
ctx.beginPath();
ctx.arc((food.x * gridSize) + gridSize/2, (food.y * gridSize) + gridSize/2, gridSize/2 - 2, 0, 2 * Math.PI);
ctx.fill();
ctx.shadowBlur = 0;
}
function generateFood() {
food.x = Math.floor(Math.random() * tileCount);
food.y = Math.floor(Math.random() * tileCount);
snake.forEach(part => {
if (part.x === food.x && part.y === food.y) generateFood();
});
}
function handleDirection(dir) {
if (changingDirection || isPaused) return;
const goingUp = dy === -1;
const goingDown = dy === 1;
const goingRight = dx === 1;
const goingLeft = dx === -1;
if (dir === 'LEFT' && !goingRight)  { dx = -1; dy = 0;  changingDirection = true; }
if (dir === 'UP' && !goingDown)     { dx = 0;  dy = -1; changingDirection = true; }
if (dir === 'RIGHT' && !goingLeft)  { dx = 1;  dy = 0;  changingDirection = true; }
if (dir === 'DOWN' && !goingUp)     { dx = 0;  dy = 1;  changingDirection = true; }
}
// Ouvinte do Teclado corrigido (Setas e WASD)
document.addEventListener("keydown", event => {
const key = event.keyCode;
if (key === 27) { // ESC
togglePause();
return;
}
if ([37, 65].includes(key)) handleDirection('LEFT');  // Seta Esquerda ou A
if ([38, 87].includes(key)) handleDirection('UP');    // Seta Cima ou W
if ([39, 68].includes(key)) handleDirection('RIGHT'); // Seta Direita ou D
if ([40, 83].includes(key)) handleDirection('DOWN');  // Seta Baixo ou S
});
function togglePause() {
if (menuScreen.classList.contains("hidden") && !gameOverScreen.classList.contains("hidden")) return;
if (!menuScreen.classList.contains("hidden")) return;
isPaused = !isPaused;
if (isPaused) {
clearTimeout(gameInterval);
pauseScreen.classList.remove("hidden");
} else {
pauseScreen.classList.add("hidden");
gameLoop();
}
}
function hasGameEnded() {
for (let i = 4; i < snake.length; i++) {
if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
}
return snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount;
}
function handleGameOver() {
clearTimeout(gameInterval);
finalScoreElement.innerText = score;
gameOverScreen.classList.remove("hidden");
}
function backToMenu() {
gameOverScreen.classList.add("hidden");
menuScreen.classList.remove("hidden");
clearCanvas();
}
clearCanvas();
